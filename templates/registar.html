{% extends "base.html" %}
{% block title %} Registar {% endblock %}
{% block content %}
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <p>{{ msg }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <h2 class="m-auto mb-3 py-2 rounded" style="width: 500px">Registar</h2>
    <form class="m-auto bg-light rounded p-3" method="POST" style="width: 500px">
        <div class="mt-3 mb-3 px-5">
            <label class="form-label">Email</label>
            <input type="text" class="form-control" placeholder="Introduza o nome" name="nome" required>
        </div>
        <div class="mt-3 mb-3 px-5">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Introduza o email" name="email" required>
        </div>
        <div class="mt-3 mb-3 px-5">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Introduza a password" name="password" required>
        </div>
        <div class="mt-3 mb-3 px-5">
            <label class="form-label" aria-required="true">Confirmar Password</label>
            <input type="password" class="form-control" placeholder="Introduza novamente a password" name="password1" required>
        </div>
      <button type="submit" class="btn btn-primary mt-1">Registar</button>
    </form>
{% endblock %}
